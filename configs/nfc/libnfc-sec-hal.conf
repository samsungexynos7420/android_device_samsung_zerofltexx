## NFC Sleep Mode Configuration ##
SLEEP_TIMEOUT=1000
WAKEUP_DELAY=80

## File Paths ##
FW_DIR_PATH="/system/vendor/firmware/nfc/"
FW_FILE_NAME="sec_s3fwrn5p_firmware.bin"

RF_DIR_PATH="/system/etc/nfc/"
RF_FILE_NAME="sec_s3fwrn5p_rfreg.bin"

POWER_DRIVER="/dev/sec-nfc"
TRANS_DRIVER="/dev/sec-nfc"

## Trace Level Settings ##
TRACE_LEVEL=2  # 0: errors only, 1: debug, 2: trace
DATA_TRACE=2   # 0: no display, 1: simple, 2: all data

## Firmware Download Options ##
FW_UPDATE_MODE=0  # 0: download for different version, 1: download for upper version, 2: force download

## Clock Configuration for X-Tal ##
FW_CFG_CLK_TYPE=0x01
FW_CFG_CLK_SPEED=0xFF
FW_CFG_CLK_REQ=0xFF
